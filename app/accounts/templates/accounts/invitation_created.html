{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'family/family.css' %}?v=20260920">
    <title>Приглашение создано</title>
</head>

<body>
{% include 'family/navigation.html' %}
<main class="content-page">

<h1>Приглашение создано</h1>

<p>
    Для:
    <strong>
        {{ invitation.person }}
    </strong>
</p>

<p>
    Email:
    {{ invitation.email }}
</p>

<p>
    Ссылка действует 7 дней:
</p>

<p>
    <input
        type="text"
        class="invite-created-url"
        value="{{ invitation_url }}"
        readonly
    >
</p>

<a href="{% url 'family:home' %}">
    Вернуться к дереву
</a>

</main>
</body>

</html>
