{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'family/family.css' %}">
    <title>Новый пароль</title>
</head>
<body>
<main class="container">
    <section class="card">
        {% if validlink %}
            <h1>Создайте новый пароль</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Сохранить пароль</button>
            </form>
        {% else %}
            <h1>Ссылка недействительна</h1>
            <p>Ссылка уже использована или срок её действия истёк.</p>
            <p><a href="{% url 'family:password_reset' %}">Запросить новую ссылку</a></p>
        {% endif %}
    </section>
</main>
</body>
</html>
