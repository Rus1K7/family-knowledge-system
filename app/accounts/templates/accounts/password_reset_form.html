{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'family/family.css' %}">
    <title>Восстановление пароля</title>
</head>
<body>
<main class="container">
    <section class="card">
        <h1>Восстановление пароля</h1>
        <p>Укажите email, который использовали при регистрации.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Отправить ссылку</button>
        </form>
        <p><a href="{% url 'family:login' %}">Вернуться ко входу</a></p>
    </section>
</main>
</body>
</html>
