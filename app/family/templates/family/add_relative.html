<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <title>
        Добавить родственника
    </title>

    <style>
        body {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        form {
            padding: 24px;

            border: 1px solid #ddd;
            border-radius: 16px;
        }

        form p {
            margin-bottom: 20px;
        }

        input,
        select {
            width: 100%;

            box-sizing: border-box;

            padding: 10px;

            margin-top: 5px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        .hint {
            color: #666;
        }
    </style>

</head>

<body>

<a href="{% url 'family:person_detail' person.id %}">
    ← Назад
</a>


<h1>
    Добавить родственника
</h1>

<p>
    Для:
    <strong>{{ person }}</strong>
</p>


<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <p class="hint">
        Если человек уже есть в семейном дереве,
        выберите его из списка.

        Если его ещё нет — оставьте список пустым
        и заполните данные нового человека.
    </p>

    <button type="submit">
        Добавить
    </button>

</form>

</body>

</html>
