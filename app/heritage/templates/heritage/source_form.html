{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'family/family.css' %}">
    <title>{{ title }}</title>
</head>

<body>

{% if person %}
    <a href="{% url 'family:person_detail' person.id %}">
        ← Назад к профилю
    </a>
{% else %}
    <a href="{% url 'family:home' %}">
        ← Назад к дереву
    </a>
{% endif %}

<h1>
    {{ title }}
</h1>

{% if resource %}
    <p>
        Для:
        <strong>{{ resource }}</strong>
    </p>
{% endif %}

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Сохранить
    </button>

</form>

</body>

</html>
