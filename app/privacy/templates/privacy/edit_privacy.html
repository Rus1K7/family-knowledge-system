{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'family/family.css' %}?v=20260920">

    <title>
        Настройки приватности
    </title>


</head>


<body>
{% include 'family/navigation.html' %}

<div class="container">

    <a href="{% url 'family:person_detail' person.id %}">
        ← Назад к профилю
    </a>


    <div class="card">

        <h1>
            Приватность
        </h1>


        <p>
            Настройка для:
        </p>

        <p>
            <strong>
                {{ resource }}
            </strong>
        </p>


        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Сохранить
            </button>

        </form>

        {% if policy %}

            <p>
                <a href="{% url 'privacy:manage_access' policy.id %}">
                    👥 Управлять доступом
                </a>
            </p>

        {% endif %}

    </div>

</div>

</body>

</html>
