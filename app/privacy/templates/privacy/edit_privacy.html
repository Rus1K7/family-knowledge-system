<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <title>
        Настройки приватности
    </title>

    <style>
        body {
            background: #f5f5f7;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
        }

        form p {
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            padding: 10px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }
    </style>

</head>


<body>

<div class="container">

    <a href="{% url 'family:person_detail' person.id %}">
        ← Назад к профилю
    </a>


    <div class="card">

        <h1>
            Приватность
        </h1>


        <p>
            Настройка для:
        </p>

        <p>
            <strong>
                {{ resource }}
            </strong>
        </p>


        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Сохранить
            </button>

        </form>

        {% if policy %}

            <p>
                <a href="{% url 'privacy:manage_access' policy.id %}">
                    👥 Управлять доступом
                </a>
            </p>

        {% endif %}

    </div>

</div>

</body>

</html>
