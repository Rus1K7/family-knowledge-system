{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'family/family.css' %}?v=20260920">
    <title>Запросить доступ</title>
</head>

<body>
{% include 'family/navigation.html' %}
<main class="narrow-page">

<a href="{% url 'family:person_detail' person.id %}">
    ← Назад
</a>

<h1>Запросить доступ</h1>

<p>
    Вы хотите запросить доступ к скрытой
    информации профиля:
    <strong>{{ person }}</strong>
</p>

<form method="post">

    {% csrf_token %}

    {% include 'family/form_fields.html' %}

    <button type="submit">
        Отправить запрос
    </button>

</form>

</main>
</body>

</html>
