{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'family/family.css' %}?v=20260920">
    <title>{{ title }}</title>

</head>

<body>
{% include 'family/navigation.html' %}

<div class="container">

    <div class="card">

        <h1>{{ title }}</h1>

        <p>
            Вы хотите отправить администратору запрос
            на удаление следующей информации:
        </p>

        <p>
            <strong>{{ object }}</strong>
        </p>

        <p>
            Информация останется в профиле,
            пока администратор не подтвердит удаление.
        </p>

        <div class="actions">

            <form method="post">
                {% csrf_token %}

                <button type="submit">
                    Отправить запрос
                </button>
            </form>

            <a href="{% url 'family:person_detail' person.id %}">
                Отмена
            </a>

        </div>

    </div>

</div>

</body>

</html>
