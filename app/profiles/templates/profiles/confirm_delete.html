<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>

    <style>
        body {
            background: #f5f5f7;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>{{ title }}</h1>

        <p>
            Вы хотите отправить администратору запрос
            на удаление следующей информации:
        </p>

        <p>
            <strong>{{ object }}</strong>
        </p>

        <p>
            Информация останется в профиле,
            пока администратор не подтвердит удаление.
        </p>

        <div class="actions">

            <form method="post">
                {% csrf_token %}

                <button type="submit">
                    Отправить запрос
                </button>
            </form>

            <a href="{% url 'family:person_detail' person.id %}">
                Отмена
            </a>

        </div>

    </div>

</div>

</body>

</html>
