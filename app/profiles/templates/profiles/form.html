{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'family/family.css' %}?v=20260920">
    <title>{{ title }}</title>

</head>

<body>
{% include 'family/navigation.html' %}

<div class="container">

    <a
        class="back"
        href="{% url 'family:person_detail' person.id %}">
        ← Назад к профилю
    </a>

    <div class="card">

        <h1>{{ title }}</h1>

        <p>
            Для: <strong>{{ person }}</strong>
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Сохранить
            </button>

        </form>

    </div>

</div>

</body>

</html>
