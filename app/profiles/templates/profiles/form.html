<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>

    <style>
        body {
            background: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
        }

        form p {
            margin-bottom: 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        input[type="checkbox"] {
            width: auto;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <a
        class="back"
        href="{% url 'family:person_detail' person.id %}">
        ← Назад к профилю
    </a>

    <div class="card">

        <h1>{{ title }}</h1>

        <p>
            Для: <strong>{{ person }}</strong>
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Сохранить
            </button>

        </form>

    </div>

</div>

</body>

</html>
