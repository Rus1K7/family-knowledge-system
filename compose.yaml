services:
  db:
    image: postgres:18.6
    container_name: family_db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: family_web

    # Development keeps live source mounting and Django's reload server.
    # The production image itself defaults to Gunicorn as a non-root user.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    user: root

    env_file:
      - .env

    volumes:
      - ./app:/app

    ports:
      - "0.0.0.0:8000:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "manage.py", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
