# Persistent test environment. Reuse this project, database and family for all UI work.
name: family-knowledge-system
services:
  db:
    image: postgres:18.6
    container_name: family_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: family-test-web:latest
    build:
      context: .
      dockerfile: Dockerfile

    container_name: family_web
    restart: unless-stopped

    # Development keeps live source mounting and Django's reload server.
    # The production image itself defaults to Gunicorn as a non-root user.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    user: root

    env_file:
      - .env

    environment:
      FKS_LOCAL_TEST: "1"
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      DJANGO_PROXY_PROTOCOL_ENABLED: "False"
      DJANGO_EMAIL_BACKEND: django.core.mail.backends.dummy.EmailBackend
      POSTGRES_HOST: db

    volumes:
      - ./app:/app

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "manage.py", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
